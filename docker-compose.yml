services:
  mysql:
    image: mysql:8.4
    container_name: lpg_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lpg_stock
      MYSQL_USER: lpg_user
      MYSQL_PASSWORD: lpg_password
      TZ: Asia/Colombo
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: lpg_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lpg_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lpg_stock
      DB_USERNAME: lpg_user
      DB_PASSWORD: lpg_password
    ports:
      - "8000:8000"
    command: >
      bash -lc "
      php -v &&
      if [ ! -f artisan ]; then
        echo 'Laravel not found in ./backend yet. Create it first.' && tail -f /dev/null;
      fi &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

volumes:
  mysql_data:
